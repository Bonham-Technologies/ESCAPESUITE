<!doctype html>
<!-- The Open Graph card (1200 × 630). rendered with Chromium at 1200 × 630 to apps/plan/public/og.png. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ESCAPE Suite card</title>
    <style>
      @font-face {
        font-family: "Archivo";
        font-weight: 100 900;
        src: url("../src/assets/fonts/archivo-latin-wght-normal.woff2") format("woff2");
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
      }
      body {
        background: #f3f0e8;
        color: #16181a;
        font-family: "Archivo", sans-serif;
        position: relative;
        overflow: hidden;
      }
      .card {
        position: absolute;
        inset: 0;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
      }
      .lockup {
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 28px;
      }
      .lockup i {
        width: 20px;
        height: 20px;
        background: #0f6b70;
      }
      .lockup b {
        font-weight: 800;
        letter-spacing: 0.04em;
      }
      .lockup span {
        color: #4f5559;
        font-size: 24px;
      }
      h1 {
        font-weight: 800;
        font-size: 84px;
        line-height: 1;
        letter-spacing: -0.025em;
        margin: auto 0 32px;
      }
      h1 em {
        font-style: normal;
        box-shadow: inset 0 -0.1em 0 #0f6b70;
      }
      p {
        margin: 0;
        font-size: 30px;
        color: #4f5559;
      }
      svg {
        position: absolute;
        right: 80px;
        top: 72px;
        width: 320px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="lockup"><i></i><b>ESCAPE SUITE</b><span>by Bonham Technologies</span></div>
      <h1>How-to videos for networks<br /><em>the cloud can&#39;t reach.</em></h1>
      <p>Record and edit screencasts in the browser. Free, open source, offline.</p>
    </div>
    <svg viewBox="0 0 400 130">
      <path d="M1 21V1h20M379 1h20v20M399 109v20h-20M21 129H1v-20" fill="none" stroke="#0f6b70" stroke-width="2" />
      <rect x="14.5" y="14.5" width="371" height="101" fill="#fbfaf6" stroke="#8a8477" />
      <rect x="28" y="28" width="8" height="8" fill="#0f6b70" />
      <g fill="#16181a" opacity=".16">
        <rect x="28" y="52" width="200" height="6" />
        <rect x="28" y="70" width="168" height="6" />
        <rect x="28" y="88" width="216" height="6" />
        <rect x="300" y="60" width="72" height="42" />
      </g>
    </svg>
  </body>
</html>
