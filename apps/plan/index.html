<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f3f0e8'/%3E%3Cpath d='M3 10V3h7M22 3h7v7M29 22v7h-7M10 29H3v-7' fill='none' stroke='%230f6b70' stroke-width='3'/%3E%3Crect x='10' y='10' width='12' height='12' fill='%230f6b70'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta. The build sets the title, description, canonical and the og:/twitter:
         title, description and url from src/lib/routeMeta.ts, per route (ESCSUITE-458). -->
    <title>ESCAPE Suite — Free browser screen recorder &amp; video editor</title>
    <meta name="description" content="Record your screen and edit video entirely in your browser. Free and open source, nothing is uploaded, and an offline build runs on air-gapped networks." />
    <link rel="canonical" href="https://escapesuite.io/" />
    <meta name="theme-color" content="#f3f0e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1113" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ESCAPE Suite" />
    <meta property="og:title" content="ESCAPE Suite — Free browser screen recorder &amp; video editor" />
    <meta property="og:description" content="Record your screen and edit video entirely in your browser. Free and open source, nothing is uploaded, and an offline build runs on air-gapped networks." />
    <meta property="og:url" content="https://escapesuite.io/" />
    <meta property="og:image" content="https://escapesuite.io/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ESCAPE Suite — free and open-source screen recorder and video editor that runs in your browser." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ESCAPE Suite — Free browser screen recorder &amp; video editor" />
    <meta name="twitter:description" content="Record your screen and edit video entirely in your browser. Free and open source, nothing is uploaded, and an offline build runs on air-gapped networks." />
    <meta name="twitter:image" content="https://escapesuite.io/og.png" />
    <meta name="twitter:image:alt" content="ESCAPE Suite — free and open-source screen recorder and video editor that runs in your browser." />

    <!-- Structured data. The build writes operatingSystem from SUPPORTED_BROWSERS in
         src/lib/routeMeta.ts on every route (ESCSUITE-465). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "ESCAPE Suite",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web (Chrome, Edge, Firefox 155+, Safari 26.6+)",
        "description": "Free, open-source screen recorder and video editor that runs entirely in the browser. No uploads, no accounts. Single-file offline builds available for air-gapped networks.",
        "url": "https://escapesuite.io/",
        "license": "https://www.apache.org/licenses/LICENSE-2.0",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "publisher": { "@type": "Organization", "name": "Bonham Technologies, LLC", "url": "https://bonham.tech/" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width:680px;margin:10vh auto;padding:0 24px;font-family:system-ui,-apple-system,sans-serif;line-height:1.55;color:#1f2937;text-align:center">
        <h1>How-to videos for networks the cloud can't reach</h1>
        <p>ESCAPE Suite records and edits screencasts entirely in the browser — free and open source under the Apache License 2.0. Nothing is uploaded, and the single-file offline build runs on isolated and regulated networks with no internet at all.</p>
        <p>Under the hood: <strong>ESCAPECRAFT</strong> records your screen and webcam, and <strong>ESCAPEARTIST</strong> is a full multi-track video editor. Export to WebM and MP4.</p>
        <p><a href="/craft/">Start recording</a> &nbsp;&middot;&nbsp; <a href="/artist/">Open the editor</a> &nbsp;&middot;&nbsp; <a href="https://github.com/Bonham-Technologies/ESCAPESUITE">View on GitHub</a></p>
        <p style="color:#6b7280;font-size:.9rem">This application requires JavaScript. Please enable it to use ESCAPE Suite.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
