        <h1>How-to videos for networks the cloud can't reach</h1>
        <p>ESCAPE Suite records and edits screencasts entirely in the browser — free and open source under the MIT license. Nothing is uploaded, and the single-file offline build runs on isolated and regulated networks with no internet at all.</p>
        <p>Under the hood: <strong>ESCAPECRAFT</strong> records your screen and webcam, and <strong>ESCAPEARTIST</strong> is a full multi-track video editor. Export to WebM and MP4.</p>
