name: Perf

# The benchmarks are informational (`pnpm perf` measures, it does not assert) and cost
# ~15 runner-minutes with Playwright, so they no longer run on every PR (ESCSUITE-26).
# They run on every push to main/dev, on a PR that carries the `perf` label (add the
# label, then push or re-run), and on demand. ci-status never depended on this job.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    types: [labeled, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: perf-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  # Performance benchmarks — informational, never a gate.
  #
  # `pnpm perf` runs the Chromium benchmarks in apps/e2e/tests/perf (preview
  # playback, a clip drag / marquee / playhead scrub over the timeline, and
  # 720p MP4/WebM export — all of one generated 12-clip scene), then the
  # headless kit's render benchmark, then merges the four into perf-report.json
  # and the job summary.
  #
  # `continue-on-error: true` and deliberately absent from ci-status's `needs`:
  # these are measurements taken on a shared runner whose CPU varies run to run,
  # so a number moving is a thing to look at, never a thing to block a merge on.
  # Skipped for Dependabot, same as e2e — a dependency bump's numbers would be
  # measured against a different runner anyway.
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    # Only on a push to main/dev, on a PR carrying the `perf` label, or by hand.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'perf'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same cache key as the e2e job, so whichever runs first populates it and
      # the other restores it.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/e2e/package.json', 'services/headless-artist/package.json') }}

      # See the standalone job for why the browser download and the apt
      # system-deps install are separate, capped and retried.
      - name: Install Playwright browser (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: |
          for attempt in 1 2; do
            if pnpm --filter=@escapesuite/e2e exec playwright install chromium; then
              exit 0
            fi
            echo "::warning::playwright install chromium failed (attempt ${attempt}/2)"
            [ "$attempt" = "2" ] || sleep 20
          done
          echo "::error::playwright install chromium failed after 2 attempts"
          exit 1

      - name: Install Playwright system dependencies
        timeout-minutes: 8
        run: |
          for attempt in 1 2; do
            if pnpm --filter=@escapesuite/e2e exec playwright install-deps chromium; then
              exit 0
            fi
            echo "::warning::playwright install-deps chromium failed (attempt ${attempt}/2)"
            [ "$attempt" = "2" ] || sleep 20
          done
          echo "::error::playwright install-deps chromium failed after 2 attempts"
          exit 1

      - name: Run benchmarks
        run: pnpm perf
        env:
          CI: true

      # Uploaded even when a benchmark fell over: a partial report is still the
      # record of what this commit measured.
      - name: Upload performance report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-report
          path: |
            perf-report.json
            **/*.cpuprofile
          retention-days: 30
          if-no-files-found: warn
