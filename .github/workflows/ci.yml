name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  NODE_VERSION: '20'

jobs:
  # Quick validation - runs on all PRs including Dependabot
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

  # Linting - parallel with type-check
  lint:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

  # TypeScript type checking - parallel with lint
  type-check:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: TypeScript check (plan)
        run: pnpm --filter=@escapesuite/plan exec tsc --noEmit

      - name: TypeScript check (craft)
        run: pnpm --filter=@escapesuite/craft exec tsc --noEmit

      - name: TypeScript check (artist)
        run: pnpm --filter=@escapesuite/artist exec tsc --noEmit

  # Unit tests with coverage
  test:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          files: |
            apps/plan/coverage/coverage-final.json
            apps/craft/coverage/coverage-final.json
            apps/artist/coverage/coverage-final.json
          fail_ci_if_error: false

  # Build - depends on lint and type-check passing
  build:
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build all apps
        run: pnpm build
        env:
          VITE_BUILD_MODE: saas
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Report bundle sizes
        run: |
          echo "## Bundle Sizes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| App | Size | Gzipped |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|------|---------|" >> $GITHUB_STEP_SUMMARY

          # ESCAPEPLAN
          if [ -d "apps/plan/dist/assets" ]; then
            PLAN_JS=$(find apps/plan/dist/assets -name "*.js" -exec du -cb {} + | tail -1 | cut -f1)
            PLAN_JS_KB=$(echo "scale=2; $PLAN_JS / 1024" | bc)
            echo "| ESCAPEPLAN | ${PLAN_JS_KB} KB | - |" >> $GITHUB_STEP_SUMMARY
          fi

          # ESCAPECRAFT (single file)
          if [ -f "apps/craft/dist/index.html" ]; then
            CRAFT_SIZE=$(du -b apps/craft/dist/index.html | cut -f1)
            CRAFT_KB=$(echo "scale=2; $CRAFT_SIZE / 1024" | bc)
            echo "| ESCAPECRAFT | ${CRAFT_KB} KB | - |" >> $GITHUB_STEP_SUMMARY
          fi

          # ESCAPEARTIST (single file)
          if [ -f "apps/artist/dist/index.html" ]; then
            ARTIST_SIZE=$(du -b apps/artist/dist/index.html | cut -f1)
            ARTIST_KB=$(echo "scale=2; $ARTIST_SIZE / 1024" | bc)
            echo "| ESCAPEARTIST | ${ARTIST_KB} KB | - |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-output
          path: |
            apps/plan/dist
            apps/craft/dist
            apps/artist/dist
          retention-days: 7

  # E2E tests - only run on PRs (required before merge, saves cycles after merge)
  e2e:
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright Browsers
        run: pnpm --filter=@escapesuite/e2e exec playwright install chromium --with-deps

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CI: true
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: test-results
          path: apps/e2e/test-results/
          retention-days: 7

  # Standalone build - builds auth-free single-file versions
  build-standalone:
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build standalone versions
        run: pnpm build:standalone
        env:
          VITE_BUILD_MODE: standalone

      - name: Report standalone bundle sizes
        run: |
          echo "## Standalone Bundle Sizes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| App | Size | Gzipped |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|------|---------|" >> $GITHUB_STEP_SUMMARY

          # ESCAPECRAFT standalone
          if [ -f "apps/craft/dist/index.html" ]; then
            CRAFT_SIZE=$(du -b apps/craft/dist/index.html | cut -f1)
            CRAFT_KB=$(echo "scale=2; $CRAFT_SIZE / 1024" | bc)
            CRAFT_GZ=$(gzip -c apps/craft/dist/index.html | wc -c)
            CRAFT_GZ_KB=$(echo "scale=2; $CRAFT_GZ / 1024" | bc)
            echo "| ESCAPECRAFT | ${CRAFT_KB} KB | ${CRAFT_GZ_KB} KB |" >> $GITHUB_STEP_SUMMARY
          fi

          # ESCAPEARTIST standalone
          if [ -f "apps/artist/dist/index.html" ]; then
            ARTIST_SIZE=$(du -b apps/artist/dist/index.html | cut -f1)
            ARTIST_KB=$(echo "scale=2; $ARTIST_SIZE / 1024" | bc)
            ARTIST_GZ=$(gzip -c apps/artist/dist/index.html | wc -c)
            ARTIST_GZ_KB=$(echo "scale=2; $ARTIST_GZ / 1024" | bc)
            echo "| ESCAPEARTIST | ${ARTIST_KB} KB | ${ARTIST_GZ_KB} KB |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload standalone artifacts
        uses: actions/upload-artifact@v6
        with:
          name: standalone-builds
          path: |
            apps/craft/dist
            apps/artist/dist
          retention-days: 30

  # Standalone E2E tests - verify auth-free builds work correctly
  test-standalone:
    runs-on: ubuntu-latest
    needs: build-standalone
    if: |
      github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Download standalone builds
        uses: actions/download-artifact@v6
        with:
          name: standalone-builds

      - name: Move standalone builds to expected locations
        run: |
          # Artifacts are downloaded as craft/dist and artist/dist at root
          # Move them to apps/craft/dist and apps/artist/dist where serve expects them
          mkdir -p apps/craft/dist apps/artist/dist
          mv craft/dist/index.html apps/craft/dist/
          mv artist/dist/index.html apps/artist/dist/
          rm -rf craft artist

          # Verify files are in place
          echo "ESCAPECRAFT standalone: $(du -h apps/craft/dist/index.html)"
          echo "ESCAPEARTIST standalone: $(du -h apps/artist/dist/index.html)"

      - name: Install Playwright Browsers
        run: pnpm --filter=@escapesuite/e2e exec playwright install chromium --with-deps

      - name: Run standalone E2E tests
        run: pnpm test:e2e:standalone
        env:
          CI: true

      - name: Upload Standalone Test Report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report-standalone
          path: apps/e2e/playwright-report-standalone/
          retention-days: 30

      - name: Upload Standalone Test Results
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: test-results-standalone
          path: apps/e2e/test-results/
          retention-days: 7

  # Deploy to Vercel - only after CI passes
  # Requires disabling Vercel's Git integration in the Vercel dashboard
  deploy:
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, build, e2e]
    # Deploy on: push to main, or PR (after e2e passes)
    # Skip for Dependabot PRs
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.type-check.result == 'success' &&
      needs.test.result == 'success' &&
      (github.event_name == 'push' || needs.e2e.result == 'success') &&
      github.actor != 'dependabot[bot]'

    permissions:
      contents: read
      pull-requests: write

    environment:
      name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build with Vercel
        run: vercel build ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VITE_BUILD_MODE: saas
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
            URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          else
            URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $URL"

      - name: Comment PR with deployment URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const body = `## 🚀 Deployment Preview\n\nThis PR has been deployed to Vercel:\n\n**Preview URL:** ${url}\n\n_Deployed after CI passed_`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Deployment Preview')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

  # Summary job that reports overall status
  ci-status:
    runs-on: ubuntu-latest
    needs: [validate, lint, type-check, test, build, build-standalone, e2e, test-standalone, deploy]
    if: always()
    steps:
      - name: Check CI Status
        run: |
          # Core jobs must pass
          if [ "${{ needs.validate.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.type-check.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "One or more CI jobs failed"
            exit 1
          fi

          # Standalone build must pass
          if [ "${{ needs.build-standalone.result }}" != "success" ]; then
            echo "Standalone build failed"
            exit 1
          fi

          # E2E must pass on PRs (skipped for Dependabot and push to main)
          if [ "${{ github.event_name }}" == "pull_request" ] && \
             [ "${{ github.actor }}" != "dependabot[bot]" ] && \
             [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "E2E tests failed"
            exit 1
          fi

          # Standalone E2E must pass on PRs (skipped for Dependabot and push to main)
          if [ "${{ github.event_name }}" == "pull_request" ] && \
             [ "${{ github.actor }}" != "dependabot[bot]" ] && \
             [ "${{ needs.test-standalone.result }}" != "success" ]; then
            echo "Standalone E2E tests failed"
            exit 1
          fi

          # Deploy should succeed (but don't fail CI if it doesn't - just warn)
          if [ "${{ needs.deploy.result }}" != "success" ] && \
             [ "${{ needs.deploy.result }}" != "skipped" ]; then
            echo "::warning::Deployment failed or was skipped"
          fi

          echo "All CI jobs passed!"
