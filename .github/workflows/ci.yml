name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Trigger for changeset release PRs (created by GITHUB_TOKEN, so pull_request won't fire)
  # pull_request_target runs in the context of the base branch but triggers for bot PRs
  # NOTE: Dependabot PRs trigger BOTH pull_request and pull_request_target, so we filter
  # in the validate job to skip pull_request_target for Dependabot (pull_request handles it)
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

# Cancel in-progress runs when a new commit is pushed to the same branch/PR
# Include event_name to prevent pull_request and pull_request_target from cancelling each other
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # Quick validation - runs on all PRs including Dependabot
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # For pull_request_target, only run for changeset bot (not Dependabot, which uses pull_request)
    # This prevents duplicate workflow runs for Dependabot PRs
    if: |
      github.event_name != 'pull_request_target' ||
      github.actor == 'github-actions[bot]' ||
      startsWith(github.head_ref, 'changeset-release/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # For pull_request_target from trusted sources, checkout the PR HEAD
          # This is safe because we filter to only trusted actors/branches above
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Surface dependency vulnerabilities in the job summary instead of
      # silently discarding them (the previous step swallowed the result).
      # Non-blocking on purpose: the repo currently has an advisory backlog,
      # so blocking would wedge every PR. Once the backlog is cleared,
      # tighten this to blocking (e.g. `pnpm audit --audit-level=critical`
      # without the `|| true`). See PR notes / security review.
      - name: Security audit (report, non-blocking)
        run: |
          {
            echo "### Dependency audit (pnpm audit --audit-level=high)"
            echo '```'
            pnpm audit --audit-level=high 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Combined lint and type-check (saves one runner's setup overhead)
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: TypeScript check (plan)
        run: pnpm --filter=@escapesuite/plan exec tsc --noEmit

      - name: TypeScript check (craft)
        run: pnpm --filter=@escapesuite/craft exec tsc --noEmit

      - name: TypeScript check (artist)
        run: pnpm --filter=@escapesuite/artist exec tsc --noEmit

  # Unit tests with coverage
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        continue-on-error: true
        with:
          files: |
            apps/plan/coverage/coverage-final.json
            apps/craft/coverage/coverage-final.json
            apps/artist/coverage/coverage-final.json
          fail_ci_if_error: false

  # Build - depends on lint/typecheck and test passing
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all apps
        run: pnpm build
        env:
          VITE_BUILD_MODE: saas
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Report bundle sizes
        run: |
          echo "## Bundle Sizes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| App | Size | Gzipped |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|------|---------|" >> $GITHUB_STEP_SUMMARY

          # ESCAPEPLAN
          if [ -d "apps/plan/dist/assets" ]; then
            PLAN_JS=$(find apps/plan/dist/assets -name "*.js" -exec du -cb {} + | tail -1 | cut -f1)
            PLAN_JS_KB=$(echo "scale=2; $PLAN_JS / 1024" | bc)
            echo "| ESCAPEPLAN | ${PLAN_JS_KB} KB | - |" >> $GITHUB_STEP_SUMMARY
          fi

          # ESCAPECRAFT (single file)
          if [ -f "apps/craft/dist/index.html" ]; then
            CRAFT_SIZE=$(du -b apps/craft/dist/index.html | cut -f1)
            CRAFT_KB=$(echo "scale=2; $CRAFT_SIZE / 1024" | bc)
            echo "| ESCAPECRAFT | ${CRAFT_KB} KB | - |" >> $GITHUB_STEP_SUMMARY
          fi

          # ESCAPEARTIST (single file)
          if [ -f "apps/artist/dist/index.html" ]; then
            ARTIST_SIZE=$(du -b apps/artist/dist/index.html | cut -f1)
            ARTIST_KB=$(echo "scale=2; $ARTIST_SIZE / 1024" | bc)
            echo "| ESCAPEARTIST | ${ARTIST_KB} KB | - |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            apps/plan/dist
            apps/craft/dist
            apps/artist/dist
          retention-days: 7

  # E2E tests - fast tests (excludes journey tests)
  # Skip for Dependabot
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    if: |
      (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') &&
      github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache Playwright browsers to save ~1 minute per run
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/e2e/package.json') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter=@escapesuite/e2e exec playwright install chromium --with-deps

      - name: Install Playwright deps (if cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter=@escapesuite/e2e exec playwright install-deps chromium

      - name: Run E2E tests (excluding journeys)
        run: pnpm --filter=@escapesuite/e2e exec playwright test --ignore-snapshots --grep-invert "Journey"
        env:
          CI: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: apps/e2e/test-results/
          retention-days: 7

  # Full E2E tests including journeys - only on main merge or with label
  e2e-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      contains(github.event.pull_request.labels.*.name, 'run-full-e2e')

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/e2e/package.json') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter=@escapesuite/e2e exec playwright install chromium --with-deps

      - name: Install Playwright deps (if cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter=@escapesuite/e2e exec playwright install-deps chromium

      - name: Run full E2E tests
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-full
          path: apps/e2e/playwright-report/
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-full
          path: apps/e2e/test-results/
          retention-days: 7

  # Standalone build - builds auth-free single-file versions
  # Skip for Dependabot: its runs carry no repo secrets, so the H4 fail-closed
  # key check below (and the keyed build) can never pass. The standalone
  # artifact is irrelevant to a dependency bump, and the ci-status gate exempts
  # Dependabot here to match (same pattern as e2e/test-standalone/deploy).
  build-standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-and-typecheck, test]
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify license public key is available
        run: |
          if [ -z "${{ secrets.LICENSE_PUBLIC_KEY }}" ]; then
            echo "::error::LICENSE_PUBLIC_KEY secret is empty. Standalone builds fail closed (audit H4), so a keyless shipped build would reject ALL licenses. Set the secret before merging."
            exit 1
          fi

      - name: Build standalone versions
        run: pnpm build:standalone
        env:
          VITE_BUILD_MODE: standalone
          # Baked into the shipped single-file builds so they can verify license
          # signatures (audit H4). It's a PUBLIC key — safe to embed in client builds.
          VITE_LICENSE_PUBLIC_KEY: ${{ secrets.LICENSE_PUBLIC_KEY }}

      - name: Report standalone bundle sizes
        run: |
          echo "## Standalone Bundle Sizes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| App | Size | Gzipped |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|------|---------|" >> $GITHUB_STEP_SUMMARY

          # ESCAPECRAFT standalone
          if [ -f "apps/craft/dist/index.html" ]; then
            CRAFT_SIZE=$(du -b apps/craft/dist/index.html | cut -f1)
            CRAFT_KB=$(echo "scale=2; $CRAFT_SIZE / 1024" | bc)
            CRAFT_GZ=$(gzip -c apps/craft/dist/index.html | wc -c)
            CRAFT_GZ_KB=$(echo "scale=2; $CRAFT_GZ / 1024" | bc)
            echo "| ESCAPECRAFT | ${CRAFT_KB} KB | ${CRAFT_GZ_KB} KB |" >> $GITHUB_STEP_SUMMARY
          fi

          # ESCAPEARTIST standalone
          if [ -f "apps/artist/dist/index.html" ]; then
            ARTIST_SIZE=$(du -b apps/artist/dist/index.html | cut -f1)
            ARTIST_KB=$(echo "scale=2; $ARTIST_SIZE / 1024" | bc)
            ARTIST_GZ=$(gzip -c apps/artist/dist/index.html | wc -c)
            ARTIST_GZ_KB=$(echo "scale=2; $ARTIST_GZ / 1024" | bc)
            echo "| ESCAPEARTIST | ${ARTIST_KB} KB | ${ARTIST_GZ_KB} KB |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload standalone artifacts
        uses: actions/upload-artifact@v7
        with:
          name: standalone-builds
          path: |
            apps/craft/dist
            apps/artist/dist
          retention-days: 30

  # Standalone E2E tests - verify auth-free builds work correctly
  test-standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Builds its OWN standalone bundle with a disposable test key so the
    # fail-closed gate (audit H4) can verify the E2E's test-signed mock licenses.
    # Does not consume the real-key build-standalone artifact.
    needs: [lint-and-typecheck, test]
    if: |
      (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') &&
      github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build standalone versions (disposable E2E test key)
        run: pnpm build:standalone
        env:
          VITE_BUILD_MODE: standalone
          # Disposable test PUBLIC key — matches the signing key in
          # apps/e2e/utils/license-mocks.ts. NOT a production key. Lets the
          # fail-closed gate (audit H4) verify the E2E's test-signed mock licenses.
          VITE_LICENSE_PUBLIC_KEY: 334ad57afb4246efec5cea53dd64a0f25828cb3d32da5a38d9661e245436daee

      - name: Verify standalone builds
        run: |
          echo "ESCAPECRAFT standalone: $(du -h apps/craft/dist/index.html)"
          echo "ESCAPEARTIST standalone: $(du -h apps/artist/dist/index.html)"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/e2e/package.json') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter=@escapesuite/e2e exec playwright install chromium --with-deps

      - name: Install Playwright deps (if cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter=@escapesuite/e2e exec playwright install-deps chromium

      - name: Run standalone E2E tests
        run: pnpm test:e2e:standalone
        env:
          CI: true

      - name: Upload Standalone Test Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-standalone
          path: apps/e2e/playwright-report-standalone/
          retention-days: 30

      - name: Upload Standalone Test Results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-standalone
          path: apps/e2e/test-results/
          retention-days: 7

  # Deploy to Vercel - reuse build artifacts instead of rebuilding
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-and-typecheck, test, build, e2e]
    # Deploy on: push to main, or PR (after e2e passes)
    # Skip for Dependabot PRs
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.lint-and-typecheck.result == 'success' &&
      needs.test.result == 'success' &&
      (github.event_name == 'push' || needs.e2e.result == 'success') &&
      github.actor != 'dependabot[bot]'

    permissions:
      contents: read
      pull-requests: write

    environment:
      name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build with Vercel
        run: vercel build ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VITE_BUILD_MODE: saas
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
            URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          else
            URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $URL"

      - name: Comment PR with deployment URL
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        uses: actions/github-script@v9
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const body = `## 🚀 Deployment Preview\n\nThis PR has been deployed to Vercel:\n\n**Preview URL:** ${url}\n\n_Deployed after CI passed_`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Deployment Preview')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

  # Summary job that reports overall status
  ci-status:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [validate, lint-and-typecheck, test, build, build-standalone, e2e, e2e-full, test-standalone, deploy]
    # Always run, but skip for pull_request_target from Dependabot and regular users
    # (Dependabot PRs use pull_request workflow, not pull_request_target)
    if: |
      always() && (
        github.event_name != 'pull_request_target' ||
        github.actor == 'github-actions[bot]' ||
        startsWith(github.head_ref, 'changeset-release/')
      )
    # Don't cancel ci-status when new commits are pushed - let it complete
    # This prevents "canceled" status from blocking PRs when commits are pushed quickly
    concurrency:
      group: ci-status-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check CI Status
        run: |
          # For pull_request_target from non-bot actors, skip validation
          # (the regular pull_request workflow handles those PRs)
          if [ "${{ github.event_name }}" == "pull_request_target" ] && \
             [ "${{ github.actor }}" != "github-actions[bot]" ] && \
             [ "${{ github.actor }}" != "dependabot[bot]" ]; then
            echo "Skipping ci-status for pull_request_target from regular user (handled by pull_request workflow)"
            exit 0
          fi

          # Core jobs must pass
          if [ "${{ needs.validate.result }}" != "success" ] || \
             [ "${{ needs.lint-and-typecheck.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "One or more CI jobs failed"
            exit 1
          fi

          # Standalone build must pass (skipped for Dependabot, which has no
          # secrets to satisfy the H4 fail-closed key check — mirrors e2e/
          # test-standalone below)
          if [ "${{ github.actor }}" != "dependabot[bot]" ] && \
             [ "${{ needs.build-standalone.result }}" != "success" ]; then
            echo "Standalone build failed"
            exit 1
          fi

          # E2E (smoke) must pass on PRs (skipped for Dependabot and push to main)
          if ( [ "${{ github.event_name }}" == "pull_request" ] || [ "${{ github.event_name }}" == "pull_request_target" ] ) && \
             [ "${{ github.actor }}" != "dependabot[bot]" ] && \
             [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "E2E smoke tests failed"
            exit 1
          fi

          # Full E2E is optional - only fails if it ran and failed
          if [ "${{ needs.e2e-full.result }}" == "failure" ]; then
            echo "Full E2E tests failed"
            exit 1
          fi

          # Standalone E2E must pass on PRs (skipped for Dependabot and push to main)
          if ( [ "${{ github.event_name }}" == "pull_request" ] || [ "${{ github.event_name }}" == "pull_request_target" ] ) && \
             [ "${{ github.actor }}" != "dependabot[bot]" ] && \
             [ "${{ needs.test-standalone.result }}" != "success" ]; then
            echo "Standalone E2E tests failed"
            exit 1
          fi

          # Deploy should succeed (but don't fail CI if it doesn't - just warn)
          if [ "${{ needs.deploy.result }}" != "success" ] && \
             [ "${{ needs.deploy.result }}" != "skipped" ]; then
            echo "::warning::Deployment failed or was skipped"
          fi

          echo "All CI jobs passed!"
