name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Trigger for changeset release PRs (created by GITHUB_TOKEN, so pull_request won't fire)
  # pull_request_target runs in the context of the base branch but triggers for bot PRs
  # NOTE: Dependabot PRs trigger BOTH pull_request and pull_request_target, so the two
  # entry-point jobs (lint-and-typecheck, test) filter out pull_request_target for
  # Dependabot (pull_request handles it). Everything else hangs off those two jobs.
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

# Cancel in-progress runs when a new commit is pushed to the same branch/PR
# Include event_name to prevent pull_request and pull_request_target from cancelling each other
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # Entry point 1 — lint, type-check and the dependency audit.
  # Combined into one runner (saves ~30s of setup overhead).
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # For pull_request_target, only run for changeset bot (not Dependabot, which uses pull_request)
    # This prevents duplicate workflow runs for Dependabot PRs. Every other job depends
    # (directly or transitively) on this job or `test`, so the filter propagates.
    if: |
      github.event_name != 'pull_request_target' ||
      github.actor == 'github-actions[bot]' ||
      startsWith(github.head_ref, 'changeset-release/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # For pull_request_target from trusted sources, checkout the PR HEAD
          # This is safe because we filter to only trusted actors/branches above
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Surface dependency vulnerabilities in the job summary instead of
      # silently discarding them (the previous step swallowed the result).
      # Non-blocking on purpose: the repo currently has an advisory backlog,
      # so blocking would wedge every PR. Once the backlog is cleared,
      # tighten this to blocking (e.g. `pnpm audit --audit-level=critical`
      # without the `|| true`). See PR notes / security review.
      - name: Security audit (report, non-blocking)
        run: |
          {
            echo "### Dependency audit (pnpm audit --audit-level=high)"
            echo '```'
            pnpm audit --audit-level=high 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Lint
        run: pnpm lint

      - name: TypeScript check (plan)
        run: pnpm --filter=@escapesuite/plan exec tsc --noEmit

      - name: TypeScript check (craft)
        run: pnpm --filter=@escapesuite/craft exec tsc --noEmit

      - name: TypeScript check (artist)
        run: pnpm --filter=@escapesuite/artist exec tsc --noEmit

  # Entry point 2 — unit tests with coverage. Runs in parallel with
  # lint-and-typecheck, so it carries the same pull_request_target filter.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name != 'pull_request_target' ||
      github.actor == 'github-actions[bot]' ||
      startsWith(github.head_ref, 'changeset-release/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        continue-on-error: true
        with:
          files: |
            apps/plan/coverage/coverage-final.json
            apps/craft/coverage/coverage-final.json
            apps/artist/coverage/coverage-final.json
          fail_ci_if_error: false

  # Build - depends on lint/typecheck and test passing
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all apps
        run: pnpm build
        env:
          VITE_BUILD_MODE: saas

      - name: Report bundle sizes
        run: |
          echo "## Bundle Sizes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| App | Size | Gzipped |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|------|---------|" >> $GITHUB_STEP_SUMMARY

          # ESCAPEPLAN
          if [ -d "apps/plan/dist/assets" ]; then
            PLAN_JS=$(find apps/plan/dist/assets -name "*.js" -exec du -cb {} + | tail -1 | cut -f1)
            PLAN_JS_KB=$(echo "scale=2; $PLAN_JS / 1024" | bc)
            echo "| ESCAPEPLAN | ${PLAN_JS_KB} KB | - |" >> $GITHUB_STEP_SUMMARY
          fi

          # ESCAPECRAFT (single file)
          if [ -f "apps/craft/dist/index.html" ]; then
            CRAFT_SIZE=$(du -b apps/craft/dist/index.html | cut -f1)
            CRAFT_KB=$(echo "scale=2; $CRAFT_SIZE / 1024" | bc)
            echo "| ESCAPECRAFT | ${CRAFT_KB} KB | - |" >> $GITHUB_STEP_SUMMARY
          fi

          # ESCAPEARTIST (single file)
          if [ -f "apps/artist/dist/index.html" ]; then
            ARTIST_SIZE=$(du -b apps/artist/dist/index.html | cut -f1)
            ARTIST_KB=$(echo "scale=2; $ARTIST_SIZE / 1024" | bc)
            echo "| ESCAPEARTIST | ${ARTIST_KB} KB | - |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            apps/plan/dist
            apps/craft/dist
            apps/artist/dist
          retention-days: 7

  # Standalone — builds the offline single-file bundles ONCE, publishes them as
  # the `standalone-builds` artifact (standalone-release.yml downloads that
  # artifact cross-run, so the name and paths are a contract), then runs the
  # standalone E2E suite against those exact files.
  #
  # The build + upload half is unconditional: standalone-release consumes the
  # artifact on main/dev pushes, and Dependabot PRs still need the build to be
  # proven. Only the E2E half is skipped for Dependabot.
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build standalone versions
        run: pnpm build:standalone
        env:
          VITE_BUILD_MODE: standalone

      - name: Report standalone bundle sizes
        run: |
          echo "## Standalone Bundle Sizes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| App | Size | Gzipped |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|------|---------|" >> $GITHUB_STEP_SUMMARY

          # ESCAPECRAFT standalone
          if [ -f "apps/craft/dist/index.html" ]; then
            CRAFT_SIZE=$(du -b apps/craft/dist/index.html | cut -f1)
            CRAFT_KB=$(echo "scale=2; $CRAFT_SIZE / 1024" | bc)
            CRAFT_GZ=$(gzip -c apps/craft/dist/index.html | wc -c)
            CRAFT_GZ_KB=$(echo "scale=2; $CRAFT_GZ / 1024" | bc)
            echo "| ESCAPECRAFT | ${CRAFT_KB} KB | ${CRAFT_GZ_KB} KB |" >> $GITHUB_STEP_SUMMARY
          fi

          # ESCAPEARTIST standalone
          if [ -f "apps/artist/dist/index.html" ]; then
            ARTIST_SIZE=$(du -b apps/artist/dist/index.html | cut -f1)
            ARTIST_KB=$(echo "scale=2; $ARTIST_SIZE / 1024" | bc)
            ARTIST_GZ=$(gzip -c apps/artist/dist/index.html | wc -c)
            ARTIST_GZ_KB=$(echo "scale=2; $ARTIST_GZ / 1024" | bc)
            echo "| ESCAPEARTIST | ${ARTIST_KB} KB | ${ARTIST_GZ_KB} KB |" >> $GITHUB_STEP_SUMMARY
          fi

      # Uploaded BEFORE the E2E steps so a test failure never costs us the
      # artifact that standalone-release.yml depends on.
      - name: Upload standalone artifacts
        uses: actions/upload-artifact@v7
        with:
          name: standalone-builds
          path: |
            apps/craft/dist
            apps/artist/dist
          retention-days: 30

      - name: Cache Playwright browsers
        if: github.actor != 'dependabot[bot]'
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/e2e/package.json') }}

      # Browser download and apt system-deps are installed as two separate,
      # individually timed steps. `playwright install --with-deps` shells out to
      # apt, which stalled for 30 minutes on a runner; an 8-minute cap plus a
      # single retry turns that hang into a fast, visible failure.
      - name: Install Playwright browser (cache miss)
        if: github.actor != 'dependabot[bot]' && steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: |
          for attempt in 1 2; do
            if pnpm --filter=@escapesuite/e2e exec playwright install chromium; then
              exit 0
            fi
            echo "::warning::playwright install chromium failed (attempt ${attempt}/2)"
            [ "$attempt" = "2" ] || sleep 20
          done
          echo "::error::playwright install chromium failed after 2 attempts"
          exit 1

      - name: Install Playwright system dependencies
        if: github.actor != 'dependabot[bot]'
        timeout-minutes: 8
        run: |
          for attempt in 1 2; do
            if pnpm --filter=@escapesuite/e2e exec playwright install-deps chromium; then
              exit 0
            fi
            echo "::warning::playwright install-deps chromium failed (attempt ${attempt}/2)"
            [ "$attempt" = "2" ] || sleep 20
          done
          echo "::error::playwright install-deps chromium failed after 2 attempts"
          exit 1

      - name: Run standalone E2E tests
        if: github.actor != 'dependabot[bot]'
        run: pnpm test:e2e:standalone
        env:
          CI: true

      - name: Upload Standalone Test Report
        uses: actions/upload-artifact@v7
        if: always() && github.actor != 'dependabot[bot]'
        with:
          name: playwright-report-standalone
          path: apps/e2e/playwright-report-standalone/
          retention-days: 30

      - name: Upload Standalone Test Results
        uses: actions/upload-artifact@v7
        if: failure() && github.actor != 'dependabot[bot]'
        with:
          name: test-results-standalone
          path: apps/e2e/test-results/
          retention-days: 7

  # E2E — the full Playwright suite (journey included; it is chromium-only and
  # adds ~2 min). Runs on PRs AND on pushes to main/dev: besides gating the
  # production deploy, a main-branch run is what SAVES the browser cache, so PR
  # branches can restore it (cache reads fall back to the base branch).
  # Skipped for Dependabot.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/e2e/package.json') }}

      # See the standalone job for why the browser download and the apt
      # system-deps install are separate, capped and retried.
      - name: Install Playwright browser (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: |
          for attempt in 1 2; do
            if pnpm --filter=@escapesuite/e2e exec playwright install chromium; then
              exit 0
            fi
            echo "::warning::playwright install chromium failed (attempt ${attempt}/2)"
            [ "$attempt" = "2" ] || sleep 20
          done
          echo "::error::playwright install chromium failed after 2 attempts"
          exit 1

      - name: Install Playwright system dependencies
        timeout-minutes: 8
        run: |
          for attempt in 1 2; do
            if pnpm --filter=@escapesuite/e2e exec playwright install-deps chromium; then
              exit 0
            fi
            echo "::warning::playwright install-deps chromium failed (attempt ${attempt}/2)"
            [ "$attempt" = "2" ] || sleep 20
          done
          echo "::error::playwright install-deps chromium failed after 2 attempts"
          exit 1

      - name: Run E2E tests
        run: pnpm --filter=@escapesuite/e2e exec playwright test --ignore-snapshots
        env:
          CI: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: apps/e2e/test-results/
          retention-days: 7

  # Deploy to Vercel — PR previews and production (push to main).
  # E2E now runs for pushes too, so it gates every deploy.
  # Skipped for Dependabot PRs.
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-and-typecheck, test, build, e2e]
    if: |
      always() &&
      needs.lint-and-typecheck.result == 'success' &&
      needs.test.result == 'success' &&
      needs.build.result == 'success' &&
      needs.e2e.result == 'success' &&
      github.actor != 'dependabot[bot]'

    permissions:
      contents: read
      pull-requests: write

    environment:
      name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build with Vercel
        run: vercel build ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VITE_BUILD_MODE: saas

      - name: Deploy to Vercel
        id: deploy
        run: |
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
            URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          else
            URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $URL"

      - name: Comment PR with deployment URL
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        uses: actions/github-script@v9
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const body = `## 🚀 Deployment Preview\n\nThis PR has been deployed to Vercel:\n\n**Preview URL:** ${url}\n\n_Deployed after CI passed_`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Deployment Preview')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

  # Summary job that reports overall status — the single required check.
  ci-status:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-and-typecheck, test, build, standalone, e2e, deploy]
    # Always run, but skip for pull_request_target from Dependabot and regular users
    # (Dependabot PRs use pull_request workflow, not pull_request_target)
    if: |
      always() && (
        github.event_name != 'pull_request_target' ||
        github.actor == 'github-actions[bot]' ||
        startsWith(github.head_ref, 'changeset-release/')
      )
    # Don't cancel ci-status when new commits are pushed - let it complete
    # This prevents "canceled" status from blocking PRs when commits are pushed quickly
    concurrency:
      group: ci-status-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check CI Status
        run: |
          # For pull_request_target from non-bot actors, skip validation
          # (the regular pull_request workflow handles those PRs)
          if [ "${{ github.event_name }}" == "pull_request_target" ] && \
             [ "${{ github.actor }}" != "github-actions[bot]" ] && \
             [ "${{ github.actor }}" != "dependabot[bot]" ]; then
            echo "Skipping ci-status for pull_request_target from regular user (handled by pull_request workflow)"
            exit 0
          fi

          # Core jobs must pass
          if [ "${{ needs.lint-and-typecheck.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "One or more CI jobs failed"
            exit 1
          fi

          # Standalone builds the offline bundles for every event (including
          # Dependabot PRs) and runs the standalone E2E suite for everyone else,
          # so it must succeed unconditionally.
          if [ "${{ needs.standalone.result }}" != "success" ]; then
            echo "Standalone build/E2E failed"
            exit 1
          fi

          # E2E runs on PRs and on pushes to main/dev (skipped for Dependabot)
          if [ "${{ github.actor }}" != "dependabot[bot]" ] && \
             [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "E2E tests failed"
            exit 1
          fi

          # Deploy should succeed (but don't fail CI if it doesn't - just warn)
          if [ "${{ needs.deploy.result }}" != "success" ] && \
             [ "${{ needs.deploy.result }}" != "skipped" ]; then
            echo "::warning::Deployment failed or was skipped"
          fi

          echo "All CI jobs passed!"
