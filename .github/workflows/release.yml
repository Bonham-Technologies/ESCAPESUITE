name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.published-packages }}
      hasChangesets: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Tag
        id: changesets
        # v2 line — compatible with @changesets/cli v3 (`changeset git-tag` NDJSON events).
        # Creates one GitHub Release per tag, named `<pkg>@<version>`, with that
        # version's CHANGELOG.md entry as the body.
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          version-script: pnpm changeset:version
          publish-script: pnpm changeset:publish
          create-github-releases: true
        # No `env: GITHUB_TOKEN` here on purpose: the `github-token` input already
        # defaults to ${{ github.token }}, and the action throws if a GITHUB_TOKEN
        # env var is set to anything other than that input's value.

  # Attach standalone builds and the headless-artist kit to the GitHub Release
  # when craft, artist, or headless-artist is released
  upload-standalone:
    name: Attach Standalone Builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: release
    if: needs.release.outputs.published == 'true'
    steps:
      - name: Check if craft, artist, or headless-artist was released
        id: check-apps
        run: |
          PACKAGES='${{ needs.release.outputs.publishedPackages }}'
          echo "Published packages: $PACKAGES"

          # Check for craft
          if echo "$PACKAGES" | grep -q '"name":"@escapesuite/craft"'; then
            CRAFT_VERSION=$(echo "$PACKAGES" | jq -r '.[] | select(.name == "@escapesuite/craft") | .version')
            echo "craft_released=true" >> $GITHUB_OUTPUT
            echo "craft_version=$CRAFT_VERSION" >> $GITHUB_OUTPUT
            echo "ESCAPECRAFT version: $CRAFT_VERSION"
          else
            echo "craft_released=false" >> $GITHUB_OUTPUT
          fi

          # Check for artist
          if echo "$PACKAGES" | grep -q '"name":"@escapesuite/artist"'; then
            ARTIST_VERSION=$(echo "$PACKAGES" | jq -r '.[] | select(.name == "@escapesuite/artist") | .version')
            echo "artist_released=true" >> $GITHUB_OUTPUT
            echo "artist_version=$ARTIST_VERSION" >> $GITHUB_OUTPUT
            echo "ESCAPEARTIST version: $ARTIST_VERSION"
          else
            echo "artist_released=false" >> $GITHUB_OUTPUT
          fi

          # Check for headless-artist
          if echo "$PACKAGES" | grep -q '"name":"@escapesuite/headless-artist"'; then
            HEADLESS_VERSION=$(echo "$PACKAGES" | jq -r '.[] | select(.name == "@escapesuite/headless-artist") | .version')
            echo "headless_released=true" >> $GITHUB_OUTPUT
            echo "headless_version=$HEADLESS_VERSION" >> $GITHUB_OUTPUT
            echo "headless-artist version: $HEADLESS_VERSION"
          else
            echo "headless_released=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.check-apps.outputs.craft_released == 'true' || steps.check-apps.outputs.artist_released == 'true' || steps.check-apps.outputs.headless_released == 'true'
        uses: actions/checkout@v7

      - name: Setup pnpm
        if: steps.check-apps.outputs.craft_released == 'true' || steps.check-apps.outputs.artist_released == 'true' || steps.check-apps.outputs.headless_released == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        if: steps.check-apps.outputs.craft_released == 'true' || steps.check-apps.outputs.artist_released == 'true' || steps.check-apps.outputs.headless_released == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.check-apps.outputs.craft_released == 'true' || steps.check-apps.outputs.artist_released == 'true' || steps.check-apps.outputs.headless_released == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build standalone versions
        if: steps.check-apps.outputs.craft_released == 'true' || steps.check-apps.outputs.artist_released == 'true'
        run: pnpm build:standalone
        env:
          VITE_BUILD_MODE: standalone

      - name: Build headless-artist kit
        if: steps.check-apps.outputs.headless_released == 'true'
        run: pnpm --filter=@escapesuite/headless-artist run pack:kit

      - name: Prepare versioned builds
        if: steps.check-apps.outputs.craft_released == 'true' || steps.check-apps.outputs.artist_released == 'true' || steps.check-apps.outputs.headless_released == 'true'
        run: |
          mkdir -p uploads

          # ESCAPECRAFT
          if [ "${{ steps.check-apps.outputs.craft_released }}" == "true" ]; then
            VERSION="${{ steps.check-apps.outputs.craft_version }}"
            cp apps/craft/dist/index.html "uploads/ESCAPECRAFT-${VERSION}.html"
            echo "Created ESCAPECRAFT build for version $VERSION"
            ls -la uploads/ESCAPECRAFT*
          fi

          # ESCAPEARTIST
          if [ "${{ steps.check-apps.outputs.artist_released }}" == "true" ]; then
            VERSION="${{ steps.check-apps.outputs.artist_version }}"
            cp apps/artist/dist/index.html "uploads/ESCAPEARTIST-${VERSION}.html"
            echo "Created ESCAPEARTIST build for version $VERSION"
            ls -la uploads/ESCAPEARTIST*
          fi

          # headless-artist kit
          if [ "${{ steps.check-apps.outputs.headless_released }}" == "true" ]; then
            VERSION="${{ steps.check-apps.outputs.headless_version }}"
            cp "services/headless-artist/dist/escapesuite-headless-artist-${VERSION}.tgz" "uploads/escapesuite-headless-artist-${VERSION}.tgz"
            echo "Created headless-artist kit for version $VERSION"
            ls -la uploads/escapesuite-headless-artist*
          fi

      - name: Attach builds to GitHub Release
        if: steps.check-apps.outputs.craft_released == 'true' || steps.check-apps.outputs.artist_released == 'true' || steps.check-apps.outputs.headless_released == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');

            // changesets/action created the per-package releases in the job
            // before this one, but the list endpoint does not always show a
            // release that new (six per-package releases shipped with no
            // asset on 2026-09-26, each looked up 20-40 s after it was
            // published — ESCSUITE-83). Look each one up by its tag, retry
            // while GitHub catches up, and fail the run if it never appears:
            // a release with no asset must be red, not green.
            const ATTEMPTS = 6;
            const RETRY_MS = 10000;

            async function findRelease(tagName) {
              for (let attempt = 1; attempt <= ATTEMPTS; attempt++) {
                try {
                  const { data } = await github.rest.repos.getReleaseByTag({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    tag: tagName
                  });
                  return data;
                } catch (error) {
                  if (error.status !== 404) throw error;
                  console.log(`Release ${tagName} not visible yet (attempt ${attempt}/${ATTEMPTS})`);
                  if (attempt < ATTEMPTS) {
                    await new Promise((resolve) => setTimeout(resolve, RETRY_MS));
                  }
                }
              }
              return null;
            }

            // Every package is attempted before the step fails, so one
            // package's problem never hides the state of the others.
            const missing = [];
            const failed = [];

            async function attach(tagName, fileName, contentType) {
              try {
                const release = await findRelease(tagName);
                if (!release) {
                  missing.push(tagName);
                  return;
                }
                await github.rest.repos.uploadReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id,
                  name: fileName,
                  data: fs.readFileSync(`uploads/${fileName}`),
                  headers: { 'content-type': contentType }
                });
                console.log(`Attached ${fileName} to release ${tagName}`);
              } catch (error) {
                console.log(`Attaching ${fileName} to ${tagName} failed: ${error.message}`);
                failed.push(`${tagName} (${error.message})`);
              }
            }

            if ('${{ steps.check-apps.outputs.craft_released }}' === 'true') {
              const version = '${{ steps.check-apps.outputs.craft_version }}';
              await attach(`@escapesuite/craft@${version}`, `ESCAPECRAFT-${version}.html`, 'text/html');
            }

            if ('${{ steps.check-apps.outputs.artist_released }}' === 'true') {
              const version = '${{ steps.check-apps.outputs.artist_version }}';
              await attach(`@escapesuite/artist@${version}`, `ESCAPEARTIST-${version}.html`, 'text/html');
            }

            if ('${{ steps.check-apps.outputs.headless_released }}' === 'true') {
              const version = '${{ steps.check-apps.outputs.headless_version }}';
              await attach(`@escapesuite/headless-artist@${version}`, `escapesuite-headless-artist-${version}.tgz`, 'application/gzip');
            }

            const problems = [];
            if (missing.length > 0) {
              problems.push(
                `No GitHub Release found for ${missing.join(', ')} after ${ATTEMPTS} attempts — ` +
                'the tag exists but changesets/action created no release for it (a missing ' +
                'CHANGELOG.md?), so nothing was attached. Attach the build from this run by hand ' +
                'once the release exists.'
              );
            }
            if (failed.length > 0) {
              problems.push(`Upload failed for ${failed.join('; ')} — re-run this job, or attach by hand.`);
            }
            if (problems.length > 0) {
              core.setFailed(problems.join('\n'));
            }
