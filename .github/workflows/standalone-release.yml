name: Standalone Release

# This workflow runs AFTER CI passes to deploy standalone builds
# It downloads artifacts from the CI workflow instead of rebuilding
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, dev]

env:
  # Supabase project URLs
  SUPABASE_URL_PROD: ${{ secrets.SUPABASE_URL }}
  SUPABASE_URL_DEV: ${{ secrets.SUPABASE_URL_DEV }}
  SUPABASE_SERVICE_KEY_PROD: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SUPABASE_SERVICE_KEY_DEV: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_DEV }}

jobs:
  # Prepare artifacts from CI workflow
  prepare:
    name: Prepare Standalone Artifacts
    runs-on: ubuntu-latest
    # Only run if CI workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read  # Required to checkout repository
      actions: read   # Required to download artifacts from triggering workflow
    outputs:
      version: ${{ steps.version.outputs.version }}
      craft_size: ${{ steps.sizes.outputs.craft }}
      artist_size: ${{ steps.sizes.outputs.artist }}
      is_pr: ${{ steps.check.outputs.is_pr }}
      pr_number: ${{ steps.check.outputs.pr_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check if PR or push
        id: check
        run: |
          if [ "${{ github.event.workflow_run.event }}" = "pull_request" ]; then
            echo "is_pr=true" >> $GITHUB_OUTPUT
            # Extract PR number from the workflow run
            echo "pr_number=${{ github.event.workflow_run.pull_requests[0].number }}" >> $GITHUB_OUTPUT
          else
            echo "is_pr=false" >> $GITHUB_OUTPUT
            echo "pr_number=" >> $GITHUB_OUTPUT
          fi

      - name: Download standalone artifacts from CI
        uses: actions/download-artifact@v8
        with:
          name: standalone-builds
          path: ./artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: version
        run: |
          CRAFT_VERSION=$(node -p "require('./apps/craft/package.json').version")
          if [ "${{ steps.check.outputs.is_pr }}" = "true" ]; then
            VERSION="${CRAFT_VERSION}-pr${{ steps.check.outputs.pr_number }}"
          else
            VERSION="${CRAFT_VERSION}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Get file sizes and prepare release artifacts
        id: sizes
        run: |
          # Move artifacts to expected structure
          mkdir -p dist/craft dist/artist

          # Find the standalone HTML files from CI artifacts
          CRAFT_HTML=$(find ./artifacts -name "index.html" -path "*/craft/*" | head -1)
          ARTIST_HTML=$(find ./artifacts -name "index.html" -path "*/artist/*" | head -1)

          if [ -z "$CRAFT_HTML" ]; then
            echo "Error: Could not find ESCAPECRAFT standalone build"
            exit 1
          fi
          if [ -z "$ARTIST_HTML" ]; then
            echo "Error: Could not find ESCAPEARTIST standalone build"
            exit 1
          fi

          VERSION="${{ steps.version.outputs.version }}"

          # Copy to versioned names
          cp "$CRAFT_HTML" "dist/craft/ESCAPECRAFT-${VERSION}.html"
          cp "$ARTIST_HTML" "dist/artist/ESCAPEARTIST-${VERSION}.html"

          # Copy to latest names
          cp "$CRAFT_HTML" "dist/craft/ESCAPECRAFT-latest.html"
          cp "$ARTIST_HTML" "dist/artist/ESCAPEARTIST-latest.html"

          # Get sizes
          CRAFT_SIZE=$(du -h "dist/craft/ESCAPECRAFT-${VERSION}.html" | cut -f1)
          ARTIST_SIZE=$(du -h "dist/artist/ESCAPEARTIST-${VERSION}.html" | cut -f1)
          echo "craft=~${CRAFT_SIZE}" >> $GITHUB_OUTPUT
          echo "artist=~${ARTIST_SIZE}" >> $GITHUB_OUTPUT

          echo "ESCAPECRAFT size: ${CRAFT_SIZE}"
          echo "ESCAPEARTIST size: ${ARTIST_SIZE}"

      - name: Generate version.json
        run: |
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > dist/version.json <<EOF
          {
            "craft": {
              "version": "${{ steps.version.outputs.version }}",
              "fileSize": "${{ steps.sizes.outputs.craft }}",
              "buildDate": "${BUILD_DATE}",
              "commit": "${{ github.event.workflow_run.head_sha }}"
            },
            "artist": {
              "version": "${{ steps.version.outputs.version }}",
              "fileSize": "${{ steps.sizes.outputs.artist }}",
              "buildDate": "${BUILD_DATE}",
              "commit": "${{ github.event.workflow_run.head_sha }}"
            }
          }
          EOF
          cat dist/version.json

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: standalone-release
          path: dist/
          retention-days: 30

  deploy-dev:
    name: Deploy to Dev Storage
    needs: prepare
    if: needs.prepare.outputs.is_pr == 'true'
    runs-on: ubuntu-latest
    environment: development
    permissions:
      pull-requests: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: standalone-release
          path: ./dist

      - name: Upload to Supabase Storage (Dev)
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"

          # Upload versioned files
          for file in dist/craft/ESCAPECRAFT-*.html dist/artist/ESCAPEARTIST-*.html; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              echo "Uploading $filename to dev storage..."
              curl -X POST \
                "${SUPABASE_URL_DEV}/storage/v1/object/downloads/${filename}" \
                -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY_DEV}" \
                -H "Content-Type: text/html" \
                -H "x-upsert: true" \
                --data-binary "@$file"
            fi
          done

          # Upload version.json
          echo "Uploading version.json..."
          curl -X POST \
            "${SUPABASE_URL_DEV}/storage/v1/object/downloads/version.json" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY_DEV}" \
            -H "Content-Type: application/json" \
            -H "x-upsert: true" \
            --data-binary "@dist/version.json"

      - name: Comment on PR
        uses: actions/github-script@v8
        with:
          script: |
            const version = '${{ needs.prepare.outputs.version }}';
            const craftSize = '${{ needs.prepare.outputs.craft_size }}';
            const artistSize = '${{ needs.prepare.outputs.artist_size }}';
            const prNumber = '${{ needs.prepare.outputs.pr_number }}';
            const devUrl = process.env.SUPABASE_URL_DEV;

            const body = [
              '## 🚀 Standalone Preview Builds Ready',
              '',
              '| App | Version | Size | Preview |',
              '|-----|---------|------|---------|',
              `| ESCAPECRAFT | \`${version}\` | ${craftSize} | [Download](${devUrl}/storage/v1/object/public/downloads/ESCAPECRAFT-${version}.html) |`,
              `| ESCAPEARTIST | \`${version}\` | ${artistSize} | [Download](${devUrl}/storage/v1/object/public/downloads/ESCAPEARTIST-${version}.html) |`,
              '',
              '> These are dev preview builds. They will be promoted to production when the PR is merged.',
              '',
              '_✅ Deployed after CI passed_'
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: parseInt(prNumber),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  deploy-prod:
    name: Deploy to Production Storage
    needs: prepare
    # Deploy to prod when CI passes for a push to main (not a PR)
    if: needs.prepare.outputs.is_pr == 'false' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: standalone-release
          path: ./dist

      - name: Upload to Supabase Storage (Production)
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"

          # Upload versioned files (for release history)
          for file in dist/craft/ESCAPECRAFT-*.html dist/artist/ESCAPEARTIST-*.html; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              echo "Uploading $filename to production storage..."
              curl -X POST \
                "${SUPABASE_URL_PROD}/storage/v1/object/downloads/${filename}" \
                -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY_PROD}" \
                -H "Content-Type: text/html" \
                -H "x-upsert: true" \
                --data-binary "@$file"
            fi
          done

          # Upload version.json
          echo "Uploading version.json..."
          curl -X POST \
            "${SUPABASE_URL_PROD}/storage/v1/object/downloads/version.json" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY_PROD}" \
            -H "Content-Type: application/json" \
            -H "x-upsert: true" \
            --data-binary "@dist/version.json"

      - name: Create GitHub Release
        uses: actions/github-script@v8
        with:
          script: |
            const version = '${{ needs.prepare.outputs.version }}';
            const craftSize = '${{ needs.prepare.outputs.craft_size }}';
            const artistSize = '${{ needs.prepare.outputs.artist_size }}';
            const headSha = '${{ github.event.workflow_run.head_sha }}';
            const prodUrl = process.env.SUPABASE_URL_PROD;

            // Check if release already exists
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: `v${version}`
              });
              console.log(`Release v${version} already exists, skipping...`);
              return;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            // Create tag
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/v${version}`,
              sha: headSha
            });

            // Create release body
            const releaseBody = [
              '## Standalone Downloads',
              '',
              '| App | Size | Download |',
              '|-----|------|----------|',
              `| ESCAPECRAFT | ${craftSize} | [ESCAPECRAFT-${version}.html](${prodUrl}/storage/v1/object/public/downloads/ESCAPECRAFT-${version}.html) |`,
              `| ESCAPEARTIST | ${artistSize} | [ESCAPEARTIST-${version}.html](${prodUrl}/storage/v1/object/public/downloads/ESCAPEARTIST-${version}.html) |`,
              '',
              '### Latest (always up-to-date)',
              `- [ESCAPECRAFT-latest.html](${prodUrl}/storage/v1/object/public/downloads/ESCAPECRAFT-latest.html)`,
              `- [ESCAPEARTIST-latest.html](${prodUrl}/storage/v1/object/public/downloads/ESCAPEARTIST-latest.html)`,
              '',
              '### Changelog',
              'See commit history for changes in this release.',
              '',
              '_✅ Released after CI passed_'
            ].join('\n');

            // Create release
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              name: `ESCAPE Suite v${version}`,
              body: releaseBody,
              draft: false,
              prerelease: false
            });

  cleanup-old-releases:
    name: Cleanup Old Dev Builds
    needs: [prepare, deploy-dev]
    if: needs.prepare.outputs.is_pr == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: List and cleanup old PR builds
        run: |
          # This is a placeholder - implement based on your retention policy
          # You could use Supabase Storage API to list and delete old PR builds
          echo "Cleanup job - implement retention policy as needed"
          # Example: Delete builds older than 30 days or from closed PRs
