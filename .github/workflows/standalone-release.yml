name: Standalone Release

# This workflow runs AFTER CI passes to deploy standalone builds
# It downloads artifacts from the CI workflow instead of rebuilding
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, dev]

# Serialize runs per branch so overlapping CI completions don't race on
# release creation. Never cancel an in-flight run.
concurrency:
  group: standalone-release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  # Prepare artifacts from CI workflow
  prepare:
    name: Prepare Standalone Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only run if CI workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read  # Required to checkout repository
      actions: read   # Required to download artifacts from triggering workflow
    outputs:
      version: ${{ steps.version.outputs.version }}
      craft_version: ${{ steps.version.outputs.craft_version }}
      artist_version: ${{ steps.version.outputs.artist_version }}
      craft_size: ${{ steps.sizes.outputs.craft }}
      artist_size: ${{ steps.sizes.outputs.artist }}
      kit_size: ${{ steps.sizes.outputs.kit }}
      is_pr: ${{ steps.check.outputs.is_pr }}
      pr_number: ${{ steps.check.outputs.pr_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check if PR or push
        id: check
        run: |
          if [ "${{ github.event.workflow_run.event }}" = "pull_request" ]; then
            echo "is_pr=true" >> $GITHUB_OUTPUT
            # Extract PR number from the workflow run
            echo "pr_number=${{ github.event.workflow_run.pull_requests[0].number }}" >> $GITHUB_OUTPUT
          else
            echo "is_pr=false" >> $GITHUB_OUTPUT
            echo "pr_number=" >> $GITHUB_OUTPUT
          fi

      - name: Download standalone artifacts from CI
        uses: actions/download-artifact@v8
        with:
          name: standalone-builds
          path: ./artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download headless-artist kit from CI
        uses: actions/download-artifact@v8
        continue-on-error: false
        with:
          name: headless-artist-kit
          path: ./artifacts/kit
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: version
        run: |
          # The umbrella release is named after the HIGHER of the two app
          # versions, not ESCAPECRAFT's. An artist-only bump used to leave the
          # tag unchanged, so no new release was cut and `latest` kept pointing
          # at the previous one with the previous ESCAPEARTIST build attached.
          CRAFT_VERSION=$(node -p "require('./apps/craft/package.json').version")
          ARTIST_VERSION=$(node -p "require('./apps/artist/package.json').version")
          BASE_VERSION=$(node -p "
            const craft = require('./apps/craft/package.json').version;
            const artist = require('./apps/artist/package.json').version;
            const parts = (v) => v.split('-')[0].split('.').map(Number);
            const [a, b] = [parts(craft), parts(artist)];
            ((a[0] - b[0]) || (a[1] - b[1]) || (a[2] - b[2])) >= 0 ? craft : artist;
          ")
          # PR builds are previews, so every name carries the PR suffix; a push
          # to main leaves the names as the bare versions the per-package
          # releases in release.yml use.
          SUFFIX=""
          if [ "${{ steps.check.outputs.is_pr }}" = "true" ]; then
            SUFFIX="-pr${{ steps.check.outputs.pr_number }}"
          fi
          echo "version=${BASE_VERSION}${SUFFIX}" >> $GITHUB_OUTPUT
          echo "craft_version=${CRAFT_VERSION}${SUFFIX}" >> $GITHUB_OUTPUT
          echo "artist_version=${ARTIST_VERSION}${SUFFIX}" >> $GITHUB_OUTPUT
          echo "Umbrella version: ${BASE_VERSION}${SUFFIX}"
          echo "ESCAPECRAFT version: ${CRAFT_VERSION}${SUFFIX}"
          echo "ESCAPEARTIST version: ${ARTIST_VERSION}${SUFFIX}"

      - name: Get file sizes and prepare release artifacts
        id: sizes
        run: |
          # Move artifacts to expected structure
          mkdir -p dist/craft dist/artist dist/kit

          # Find the standalone HTML files from CI artifacts
          CRAFT_HTML=$(find ./artifacts -name "index.html" -path "*/craft/*" | head -1)
          ARTIST_HTML=$(find ./artifacts -name "index.html" -path "*/artist/*" | head -1)
          KIT_TGZ=$(find ./artifacts/kit -name "*.tgz" | head -1)

          if [ -z "$CRAFT_HTML" ]; then
            echo "Error: Could not find ESCAPECRAFT standalone build"
            exit 1
          fi
          if [ -z "$ARTIST_HTML" ]; then
            echo "Error: Could not find ESCAPEARTIST standalone build"
            exit 1
          fi
          if [ -z "$KIT_TGZ" ]; then
            echo "Error: Could not find headless-artist kit tarball"
            exit 1
          fi

          VERSION="${{ steps.version.outputs.version }}"
          CRAFT_VERSION="${{ steps.version.outputs.craft_version }}"
          ARTIST_VERSION="${{ steps.version.outputs.artist_version }}"

          # Copy to versioned names. Each HTML build carries its own app's
          # version — the same name release.yml attaches to that package's own
          # release — while the kit tarball carries the umbrella version.
          cp "$CRAFT_HTML" "dist/craft/ESCAPECRAFT-${CRAFT_VERSION}.html"
          cp "$ARTIST_HTML" "dist/artist/ESCAPEARTIST-${ARTIST_VERSION}.html"
          cp "$KIT_TGZ" "dist/kit/escapesuite-headless-artist-${VERSION}.tgz"

          # Copy to latest names
          cp "$CRAFT_HTML" "dist/craft/ESCAPECRAFT-latest.html"
          cp "$ARTIST_HTML" "dist/artist/ESCAPEARTIST-latest.html"

          # Get sizes
          CRAFT_SIZE=$(du -h "dist/craft/ESCAPECRAFT-${CRAFT_VERSION}.html" | cut -f1)
          ARTIST_SIZE=$(du -h "dist/artist/ESCAPEARTIST-${ARTIST_VERSION}.html" | cut -f1)
          KIT_SIZE=$(du -h "dist/kit/escapesuite-headless-artist-${VERSION}.tgz" | cut -f1)
          echo "craft=~${CRAFT_SIZE}" >> $GITHUB_OUTPUT
          echo "artist=~${ARTIST_SIZE}" >> $GITHUB_OUTPUT
          echo "kit=~${KIT_SIZE}" >> $GITHUB_OUTPUT

          echo "ESCAPECRAFT size: ${CRAFT_SIZE}"
          echo "ESCAPEARTIST size: ${ARTIST_SIZE}"
          echo "Headless-artist kit size: ${KIT_SIZE}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: standalone-release
          path: dist/
          retention-days: 30

  comment-pr:
    name: PR Build Comment
    needs: prepare
    if: needs.prepare.outputs.is_pr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write

    steps:
      - name: Comment on PR
        uses: actions/github-script@v9
        with:
          script: |
            const version = '${{ needs.prepare.outputs.version }}';
            const craftVersion = '${{ needs.prepare.outputs.craft_version }}';
            const artistVersion = '${{ needs.prepare.outputs.artist_version }}';
            const craftSize = '${{ needs.prepare.outputs.craft_size }}';
            const artistSize = '${{ needs.prepare.outputs.artist_size }}';
            const kitSize = '${{ needs.prepare.outputs.kit_size }}';
            const prNumber = '${{ needs.prepare.outputs.pr_number }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              '### 📦 Standalone builds ready',
              '',
              'Offline single-file builds for this PR are attached as the',
              `\`standalone-release\` artifact on [this workflow run](${runUrl}).`,
              '',
              '| App | Version | Size |',
              '|-----|---------|------|',
              `| ESCAPECRAFT | \`${craftVersion}\` | ${craftSize} |`,
              `| ESCAPEARTIST | \`${artistVersion}\` | ${artistSize} |`,
              `| Headless render kit | \`${version}\` | ${kitSize} |`,
              '',
              '_✅ Built after CI passed_'
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: parseInt(prNumber),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  release:
    name: Create GitHub Release
    needs: prepare
    # Release only for a push to main (never for PR builds or dev pushes)
    if: needs.prepare.outputs.is_pr == 'false' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: standalone-release
          path: ./dist

      - name: Create release with attached builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CRAFT_VERSION: ${{ needs.prepare.outputs.craft_version }}
          ARTIST_VERSION: ${{ needs.prepare.outputs.artist_version }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh release view "v${VERSION}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists, skipping."
            exit 0
          fi

          gh release create "v${VERSION}" \
            "dist/craft/ESCAPECRAFT-${CRAFT_VERSION}.html" \
            "dist/artist/ESCAPEARTIST-${ARTIST_VERSION}.html" \
            "dist/kit/escapesuite-headless-artist-${VERSION}.tgz" \
            --repo "${REPO}" \
            --target "${COMMIT}" \
            --title "ESCAPE Suite v${VERSION}" \
            --notes "Offline single-file builds. Download, open in Chrome/Edge, done — no install, no account, no internet. Headless render kit: render ARTIST projects on a server or GPU box — unpack and read the README inside. This tarball is versioned to match this suite release; the kit's own package version is independent and is what \`headless-artist --version\` reports."
