name: DCO

# Every commit in a pull request must be signed off under the Developer
# Certificate of Origin (CONTRIBUTING.md, ESCSUITE-419). Bot commits are exempt.
# This is its own check ("DCO / sign-off"), not part of ci-status: the owner
# decides whether `main`'s ruleset requires it.
on:
  pull_request:
    branches: [main, dev]

concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sign-off:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/dco-check.mjs "$BASE_SHA" "$HEAD_SHA"
