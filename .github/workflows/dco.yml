name: DCO

# Every commit in a pull request from a fork must be signed off under the
# Developer Certificate of Origin (CONTRIBUTING.md, ESCSUITE-419). Bot commits are
# exempt. Branches pushed to this repository (the owner's, the autopilot's,
# Dependabot's, the changesets bot's) skip the job: only people with write access
# can push here, which is the fleet's `members: false` rule (ESCSUITE-424).
# This is its own check ("DCO / sign-off"), not part of ci-status: the owner
# decides whether `main`'s ruleset requires it.
on:
  pull_request:
    branches: [main, dev]

concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sign-off:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/dco-check.mjs "$BASE_SHA" "$HEAD_SHA"
