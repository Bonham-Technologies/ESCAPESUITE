name: Rebase Dependabot PRs

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    # Only run when the push is a merged PR (not direct pushes or other workflows)
    if: github.event.head_commit.message && contains(github.event.head_commit.message, 'Merge pull request')
    steps:
      - name: Trigger rebase on open Dependabot PRs
        run: |
          # Get all open Dependabot PRs
          PRS=$(gh pr list --repo "$GITHUB_REPOSITORY" --author "dependabot[bot]" --state open --json number,headRefName --jq '.[].number')

          if [ -z "$PRS" ]; then
            echo "No open Dependabot PRs to rebase"
            exit 0
          fi

          for PR in $PRS; do
            echo "Requesting rebase on PR #$PR..."
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "@dependabot rebase" || true
          done

          echo "Rebase requested on $(echo "$PRS" | wc -w | tr -d ' ') Dependabot PRs"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
