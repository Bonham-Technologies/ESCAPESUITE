version: 2
updates:
  # All npm dependencies (pnpm monorepo - single lockfile at root)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      # Group related packages to reduce PR noise
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      clerk:
        patterns:
          - "@clerk/*"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "fake-indexeddb"
          - "jsdom"
      linting:
        patterns:
          - "eslint*"
          - "typescript-eslint"
          - "@eslint/*"
      build-tools:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "turbo"
      types:
        patterns:
          - "@types/*"
        exclude-patterns:
          - "@types/react*"  # Already in react group

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
