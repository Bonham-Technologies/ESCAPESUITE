version: 2
updates:
  # All npm dependencies (pnpm monorepo - single lockfile at root)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 8
    rebase-strategy: "auto"
    ignore:
      # release.yml pins changesets/action to a v1 build that parses the CLI v2 `changeset tag`
      # output ("New tag: …"). CLI v3 changed that output and the action then reports nothing
      # published, so no per-package releases are created. Migrate action + CLI together.
      - dependency-name: "@changesets/cli"
        update-types: ["version-update:semver-major"]
    groups:
      # Group related packages to reduce PR noise
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      runtime:
        # Production runtime dependencies shared across the apps.
        # mediabunny is deliberately excluded — it gets its own solo PR
        # so the real export pipeline can be verified before each bump.
        patterns:
          - "react*"
          - "react-router-dom"
          - "zustand"
          - "uuid"
          - "mp4box"
          - "idb"
          - "webm-duration-fix"
          - "@vercel/analytics"
        exclude-patterns:
          - "mediabunny"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "fake-indexeddb"
          - "jsdom"
          - "@playwright/test"
          - "@axe-core/*"
          - "wait-on"
          - "serve"
      linting:
        patterns:
          - "eslint*"
          - "typescript-eslint"
          - "@eslint/*"
      build-tools:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "turbo"
          - "cross-env"
          - "rollup-plugin-visualizer"
      types:
        patterns:
          - "@types/*"
        exclude-patterns:
          - "@types/react*"  # Already in react group

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    ignore:
      # pinned to a CLI-v2-compatible build in release.yml — unignore when @changesets/cli moves to v3
      - dependency-name: "changesets/action"
    groups:
      actions:
        patterns:
          - "*"
