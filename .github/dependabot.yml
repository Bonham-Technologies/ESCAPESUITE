version: 2
updates:
  # Root dependencies (Turbo)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      turbo:
        patterns:
          - "turbo"

  # ESCAPEPLAN dependencies
  - package-ecosystem: "npm"
    directory: "/apps/plan"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      clerk:
        patterns:
          - "@clerk/*"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
      linting:
        patterns:
          - "eslint*"
          - "typescript-eslint"
          - "@eslint/*"

  # ESCAPECRAFT dependencies
  - package-ecosystem: "npm"
    directory: "/apps/craft"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      clerk:
        patterns:
          - "@clerk/*"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
      linting:
        patterns:
          - "eslint*"
          - "typescript-eslint"
          - "@eslint/*"

  # ESCAPEARTIST dependencies
  - package-ecosystem: "npm"
    directory: "/apps/artist"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      clerk:
        patterns:
          - "@clerk/*"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
      linting:
        patterns:
          - "eslint*"
          - "typescript-eslint"
          - "@eslint/*"

  # E2E test dependencies
  - package-ecosystem: "npm"
    directory: "/apps/e2e"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      playwright:
        patterns:
          - "@playwright/*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
