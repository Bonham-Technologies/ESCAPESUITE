version: 2
updates:
  # All npm dependencies (pnpm monorepo - single lockfile at root)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    groups:
      # Group related packages to reduce PR noise
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      clerk:
        patterns:
          - "@clerk/*"
      stripe:
        patterns:
          - "@stripe/*"
      supabase:
        patterns:
          - "@supabase/*"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "fake-indexeddb"
          - "jsdom"
          - "@playwright/test"
          - "@axe-core/*"
      linting:
        patterns:
          - "eslint*"
          - "typescript-eslint"
          - "@eslint/*"
      build-tools:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "turbo"
          - "cross-env"
          - "rollup-plugin-visualizer"
      types:
        patterns:
          - "@types/*"
        exclude-patterns:
          - "@types/react*"  # Already in react group

  # E2E app dependencies (separate lockfile)
  - package-ecosystem: "npm"
    directory: "/apps/e2e"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    groups:
      e2e-deps:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    groups:
      actions:
        patterns:
          - "*"
